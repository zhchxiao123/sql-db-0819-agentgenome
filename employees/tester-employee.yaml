id: tester-employee
name: 测试员工
runtime: agentteams
model: default
prompt: prompts/tester.md
procedures:
- write-tests
crafts:
- test-design
- genome-navigation
- output-discipline
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - '{task_modules}/**/tests/**'
  - '{task_modules}/**/test/**'
  - '{task_modules}/**/test_*.*'
  - '{task_modules}/**/*_test.*'
  - tasks/{task_id}/**
  forbid_paths:
  - genome/rules/**
  - .github/**
  - .gitmodules
assignee: ''

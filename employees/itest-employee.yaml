id: itest-employee
name: 集测员工
runtime: agentteams
model: default
prompt: prompts/itest.md
procedures:
- itest-prepare
- itest-run
crafts:
- log-forensics
- failure-diagnosis
- output-discipline
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - tasks/{task_id}/**
  - itest/**
  - repos/*/itest/**
  forbid_paths:
  - repos/*/src/**
assignee: ''
